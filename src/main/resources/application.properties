spring.application.name=nasimmobilier

# PostgreSQL = seule base (source de verite). SQLite reste sur le classpath mais n'est pas configure.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/nasimmobilier}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}

# Le schema est gere par Flyway ; Hibernate se contente de le verifier.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true

# Identite affichee sur les devis
app.company.name=${COMPANY_NAME:NASIM IMMOBILIER}
app.company.address=${COMPANY_ADDRESS:Lome, Togo}
app.company.phone=${COMPANY_PHONE:}
app.company.email=${COMPANY_EMAIL:}
app.company.nif=${COMPANY_NIF:}
app.company.logo=${COMPANY_LOGO:classpath:logo.png}

springdoc.swagger-ui.path=/swagger-ui.html

# Politique de selection des prix (mediane des observations COMMERCIALES validees)
app.pricing.max-observation-age-days=${PRICING_MAX_AGE_DAYS:90}
app.pricing.min-observations=${PRICING_MIN_OBSERVATIONS:2}
app.pricing.require-same-locality=${PRICING_REQUIRE_SAME_LOCALITY:true}
app.pricing.include-demo=false
app.pricing.high-confidence-min-observations=3
app.pricing.high-confidence-max-spread-percent=25

# Remise maximale acceptee sur un devis (en %)
app.quote.max-discount-percent=${QUOTE_MAX_DISCOUNT_PERCENT:100}
