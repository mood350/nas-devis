services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: nasimmobilier
      POSTGRES_USER: nasim
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis (voir .env.example)}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nasim -d nasimmobilier"]
      interval: 5s
      retries: 10
  app:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://db:5432/nasimmobilier
      DB_USER: nasim
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD est requis (voir .env.example)}
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-}
    ports:
      - "8080:8080"
volumes:
  pgdata:
